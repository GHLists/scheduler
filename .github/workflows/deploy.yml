name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to run on. Defaults to the primary runner."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  primary:
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit
    with:
      runner: ${{ inputs.runner || vars.RUNNER_PRIMARY || 'self-hosted' }}

  backup:
    needs: primary
    if: ${{ failure() || cancelled() }}
    uses: ./.github/workflows/deploy-worker.yml
    secrets: inherit
    with:
      runner: ${{ vars.RUNNER_BACKUP || 'self-hosted' }}
